name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q agent tools adapters apps
      - run: python -m pytest -p no:cacheprovider
      - name: definition-of-done smoke (mock)
        run: |
          devops-agent --mock -q "Why is my Kubernetes API deployment failing?"
          devops-agent --mock --yes -q jira DEVOPS-382
          devops-agent --mock -q plan "upgrade our Kubernetes worker nodes"
