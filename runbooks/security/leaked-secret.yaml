name: security-leaked-secret
description: A credential was committed to a repository or printed in logs.
trigger:
  - leaked secret
  - secret committed
  - credential in git
  - exposed token
  - gitleaks finding
severity: critical
tags: [security, secrets]
prechecks:
  - description: Confirm the finding with the built-in scanner (never print the value)
    tool: sec_secret_scan
diagnosis:
  - description: Identify the secret type, owner system and blast radius (which environments/accounts accept it)
  - description: Check git history and CI logs for how widely it propagated
    tool: sec_gitleaks
commands:
  - gitleaks detect --source . --no-git
  - git log -S<pattern> --all --oneline
expected_results:
  - The secret type and its owner are identified; rotation procedure known
remediation:
  - description: Rotate/revoke the credential at the source system FIRST (human action; the agent never handles secret values)
    approval_required: true
  - description: Remove the secret from code, move it to a secret manager, purge history if required, invalidate caches
    approval_required: true
validation:
  - description: Scanners are clean; old credential rejected by the target system; new credential delivered via secret manager
    tool: sec_secret_scan
rollback:
  - description: Not applicable - a leaked credential must stay revoked
approval_required: true
