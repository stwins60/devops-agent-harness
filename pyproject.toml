[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-agent-harness"
version = "0.1.0"
description = "Production-grade, model-agnostic DevOps AI agent harness with policy, approval and audit enforcement outside the LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "DevOps Agent Harness Contributors" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout>=2.1"]

[project.scripts]
devops-agent = "apps.cli.main:main"

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "adapters*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
